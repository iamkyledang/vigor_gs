[pytest]
testpaths = tests
addopts = -ra -q -p no:cacheprovider
filterwarnings =
    ignore::pytest.PytestRemovedIn10Warning
    ignore:The given NumPy array is not writable
markers =
    gpu: needs a CUDA device and the extension built from submodules/diff-surfel-anych
    slow: trains a short run on the synthetic scene
